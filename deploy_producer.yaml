apiVersion: apps/v1
kind: Deployment
metadata:
  name: binance-producer
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: binance-producer
  template:
    metadata:
      labels:
        app: binance-producer
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      containers:
        - name: binance
          image: ghcr.io/${{ github.repository }}/binance-producer:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: BINANCE_TOPIC
              value: "binance.raw"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"