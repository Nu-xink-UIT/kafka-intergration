apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcb-producer
  namespace: kafka
  labels:
    app: vcb-producer
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
    min.insync.replicas: 2
  selector:
    matchLabels:
      app: vcb-producer
  template:
    metadata:
      labels:
        app: vcb-producer
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      containers:
      - name: vcb-producer

        image: ghcr.io/nu-xink-uit/kafka-intergration/vcb-producer:latest
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka-cluster-kafka-bootstrap:9092"
        - name: VCB_TOPIC
          value: "vcb_exchange_rates"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"