apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: vcb-exchange-rates
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  topicName: "vcb_exchange_rates"
  partitions: 3
  replicas: 3
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
    min.insync.replicas: 2


apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcb-producer
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vcb-producer
  template:
    metadata:
      labels:
        app: vcb-producer
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      containers:
        - name: vcb-producer
          image: ghcr.io/${{ github.repository }}/vcb-producer:latest
          imagePullPolicy: Always
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: VCB_TOPIC
              value: "vcb_exchange_rates"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"