name: Binance CI/CD

on:
  push:
    branches: [ "feat/binance" ]
    paths:
      - 'src/binance/**'
      - 'requirements.txt'
      - 'dockerfile'
      - 'deploy_producer.yaml'
      - ci-cd.yml
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Load kubeconfig
        run: |
          # Sử dụng printf để tránh lỗi định dạng Base64
          printf "%s" "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Apply Kubernetes manifests
        run: |
          # Giờ đây lệnh kubectl đã sẵn sàng
          kubectl apply -f deploy_producer.yaml -n kafka

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG
        id: set_tag
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          # Chuyển tên repository về chữ thường để đúng chuẩn Docker image
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_REPO}/binance-producer:${TIMESTAMP}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}


  deploy-to-k8s:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Load kubeconfig
        run: |
          # Dùng printf để tránh lỗi "invalid input" của base64
          printf "%s" "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Replace image in deploy_producer.yaml
        run: |
          # Kiểm tra xem file có tồn tại không trước khi chạy sed
          if [ ! -f "deploy_producer.yaml" ]; then
            echo "Lỗi: Không tìm thấy file deploy_producer.yaml trong thư mục gốc!"
            ls -R
            exit 1
          fi
          # Thay thế image bằng tag mới nhất vừa build
          sed -i "s|image: .*|image: ${{ needs.build-and-push.outputs.image_tag }}|g" deploy_producer.yaml

      - name: Apply Kubernetes manifests
        run: |
          # Sử dụng file đã được cập nhật image
          kubectl --kubeconfig=$KUBECONFIG apply -f deploy_producer.yaml -n kafka

      - name: Wait for rollout
        run: |
          # Đảm bảo tên deployment trong file yaml của bạn là binance-producer
          kubectl --kubeconfig=$KUBECONFIG rollout status deployment/binance-producer -n kafka