name: VCB CI/CD

on:
  push:
    branches: [ "feat/vcb" ]
    paths:
      - 'src/vcb/**'
      - 'requirements.txt'
      - 'dockerfile'
      - 'deploy_producer.yaml'
      - '.github/workflows/vcb-ci-cd.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG
        id: set_tag
        run: |
          # Tạo tag dựa trên thời gian thực: yyyymmdd-hhmmss
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          # Chuyển tên repository về chữ thường để đúng chuẩn Docker image
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          # Đặt tên image là vcb-producer
          IMAGE_TAG="ghcr.io/${IMAGE_REPO}/vcb-producer:${TIMESTAMP}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}

  deploy-to-k8s:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Load kubeconfig
        run: |
          printf "%s" "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      
      - name: Create GHCR ImagePullSecret
        run: |
          # Xóa secret cũ nếu có để tránh lỗi và tạo lại bản mới
          $KUBECTL_PATH delete secret ghcr-auth -n kafka --ignore-not-found
          $KUBECTL_PATH create secret docker-registry ghcr-auth \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            -n kafka
        env:
          KUBECTL_PATH: ${{ steps.install-kubectl.outputs.kubectl-path }}

      - name: Replace image in deploy_producer.yaml
        run: |
          sed -i "s|image: .*|image: ${{ needs.build-and-push.outputs.image_tag }}|g" deploy_producer.yaml

      - name: Apply Kubernetes manifests
        run: |
          $KUBECTL_PATH apply -f deploy_producer.yaml -n kafka
        env:
          KUBECTL_PATH: ${{ steps.install-kubectl.outputs.kubectl-path }}

      - name: Wait for rollout
        run: |
          $KUBECTL_PATH rollout status deployment/vcb-producer -n kafka
        env:
          KUBECTL_PATH: ${{ steps.install-kubectl.outputs.kubectl-path }}