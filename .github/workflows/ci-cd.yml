name: CI

on:
  push:
    branches: [ "feat/sjc" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
            
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Set IMAGE_TAG
        id: set_tag
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_REPO}:${TIMESTAMP}"
      
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
      
          echo "Using image: $IMAGE_TAG"
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
  deploy-to-k8s:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Load kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl get nodes

      - name: Replace image in deploy_producer.yaml
        run: |
          sed -i "s|image: .*|image: ${{ needs.build-and-push.outputs.image_tag }}|g" deploy_producer.yaml

      - name: Apply Kubernetes manifests
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f deploy_producer.yaml -n kafka

      - name: Wait for rollout
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl rollout status deployment/sjc-producer -n kafka


