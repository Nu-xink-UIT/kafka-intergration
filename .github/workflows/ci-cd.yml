name: Binance CI/CD

on:
  push:
    branches: [ "feat/binance" ]
    paths:
      - 'src/binance/**'
      - 'requirements.txt'
      - 'dockerfile'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.set_tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set IMAGE_TAG
        id: set_tag
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          # Chuyển tên repository về chữ thường để đúng chuẩn Docker image
          IMAGE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${IMAGE_REPO}/binance-producer:${TIMESTAMP}"

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Using image: $IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}


  deploy-to-k8s:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout source (to get k8s manifests)
        uses: actions/checkout@v4

      - name: Load kubeconfig
        run: |
          # Giải mã kubeconfig từ Secret đã cài đặt
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Update Deployment Image
        run: |
          # Thay thế image trong file deploy cụ thể của binance
          # Đảm bảo bạn đã có file deploy_producer.yaml trong repo
          sed -i "s|image: .*|image: ${{ needs.build-and-push.outputs.image_tag }}|g" deploy_producer.yaml

      - name: Apply Kubernetes manifests
        run: |
          # Sử dụng namespace kafka như cấu hình hiện tại
          kubectl --kubeconfig=$KUBECONFIG apply -f deploy_producer.yaml -n kafka

      - name: Wait for rollout
        run: |
          # Kiểm tra trạng thái rollout của deployment binance
          kubectl --kubeconfig=$KUBECONFIG rollout status deployment/binance-producer -n kafka